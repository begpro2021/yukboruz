services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yukbor
      POSTGRES_PASSWORD: yukbor
      POSTGRES_DB: yukbor
    ports:
      - "5432:5432"
    volumes:
      - yukbor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukbor -d yukbor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yukbor-postgres:
