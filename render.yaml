services:
  - type: web
    name: yukbor-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate --workspace server && npm run build --workspace server
    startCommand: npm run db:migrate:deploy --workspace server && npm run start --workspace server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
